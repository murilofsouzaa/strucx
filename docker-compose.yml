services:
  # Backend Node.js Express Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: strucx-backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost,http://localhost:80,http://localhost:5173,https://strucx.com.br
      - ADMIN_EMAIL=${ADMIN_EMAIL:-onemurilo@gmail.com}
      - FROM_EMAIL=${FROM_EMAIL:-StrucX Systems <no-reply@strucx.com.br>}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    volumes:
      - strucx-leads-data:/app/leads
    networks:
      - strucx-network
    expose:
      - "3001"

  # Frontend Nginx React SPA Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: strucx-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - strucx-network

volumes:
  strucx-leads-data:
    driver: local

networks:
  strucx-network:
    driver: bridge
