# ==============================================================================
# NGINX Configuration for: strucx.mubadev.com.br
# Location on VPS/Server: /etc/nginx/sites-available/strucx.mubadev.com.br
# Symlink: ln -s /etc/nginx/sites-available/strucx.mubadev.com.br /etc/nginx/sites-enabled/
# ==============================================================================

# 1. HTTP Server Block (Redirect all traffic to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name strucx.mubadev.com.br www.strucx.mubadev.com.br;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Main Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name strucx.mubadev.com.br www.strucx.mubadev.com.br;

    # SSL Certificates (Managed by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/strucx.mubadev.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/strucx.mubadev.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Root Directory (Path to compiled React Frontend SPA)
    root /var/www/strucx/frontend/dist;
    index index.html;

    # Performance: Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml
        application/javascript
        application/json
        image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Payload size limit
    client_max_body_size 25M;

    # ==========================================================================
    # API Backend Reverse Proxy (Node.js Express on Port 3001)
    # ==========================================================================
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # ==========================================================================
    # Static Assets Long-Term Cache (3D WebP Frames, Videos & Bundles)
    # ==========================================================================
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ==========================================================================
    # SPA Client-Side Routing Fallback (React Router)
    # ==========================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health Check
    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    # Error Pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
