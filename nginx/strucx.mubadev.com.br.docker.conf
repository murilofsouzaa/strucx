# ==============================================================================
# NGINX Configuration (Proxy to Docker Compose) for: strucx.mubadev.com.br
# Use this when running 'docker compose up -d' on the VPS (Frontend on Port 80/8080)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name strucx.mubadev.com.br www.strucx.mubadev.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name strucx.mubadev.com.br www.strucx.mubadev.com.br;

    ssl_certificate /etc/letsencrypt/live/strucx.mubadev.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/strucx.mubadev.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25M;

    # Pass all requests directly to the Docker Container
    location / {
        proxy_pass http://127.0.0.1:80; # or mapped host port e.g. 8080
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
