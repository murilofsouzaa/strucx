name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # 1. Validation Job for Frontend
  validate-frontend:
    name: Lint & Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeCheck & Build Frontend
        working-directory: ./frontend
        run: npm run build

  # 2. Validation Job for Backend
  validate-backend:
    name: Lint & Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: TypeCheck & Compile Backend
        working-directory: ./backend
        run: npm run build

  # 3. Docker Image Build & Test
  docker-build:
    name: Build & Verify Docker Containers
    runs-on: ubuntu-latest
    needs: [validate-frontend, validate-backend]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: strucx-frontend:latest

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: strucx-backend:latest

  # 4. Automated CD Deployment to VPS (Native OpenSSH with Port Support)
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via Native SSH to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$HOST" ] || [ -z "$USER" ]; then
            echo "❌ Erro: VPS_SSH_KEY, VPS_HOST ou VPS_USER não configurados nas secrets."
            exit 1
          fi

          echo "🔐 Configurando autenticação SSH na porta $PORT..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Salva a chave privada e garante permissões 600
          printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Adiciona o host aos known_hosts na porta especificada
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

          echo "🚀 Conectando e executando deploy na VPS ($HOST:$PORT)..."
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key -p "$PORT" "$USER@$HOST" << 'EOF'
            set -e
            echo "📍 Diretório atual:"
            cd ~/projects/strucx || cd /var/www/strucx || exit 1
            pwd
            echo "📥 Puxando alterações do repositório..."
            git pull origin main
            echo "🐳 Subindo e recriando containers Docker..."
            docker compose up -d --build
            echo "✅ Deploy finalizado com sucesso na VPS!"
          EOF
